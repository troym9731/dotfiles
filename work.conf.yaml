- defaults:
    link:
      relink: true
      create: true

- link:
    ~/.zshrc: zsh/work/zshrc
    ~/.config/fish/config.fish:
      path: fish/work/config.fish
      force: true
    ~/.gitconfig: git/work/gitconfig
    ~/.codex/config.toml: codex/config.toml
    ~/.codex/AGENTS.md: codex/_AGENTS.md
    ~/.config/jj/config.toml: jj/work/config.toml
    ~/.config/mise/config.toml: mise/work/config.toml
    ~/.config/rex/init.lua: rex/work/init.lua
    ~/.aws/config: aws/work/config

- shell:
    - [ln -sf ~/.dotfiles/codex/default.rules ~/.codex/rules/default.rules, "Copying over Codex rules"]
